"$schema" = 'https://starship.rs/config-schema.json'

# Bira's two-line layout, with only the modules we actually display.
add_newline = false
format = '╭─$username$hostname$directory$git_branch${custom.git_status}$python$line_break╰─$character'
right_format = '$status'

[username]
show_always = true
style_user = 'bold green'
style_root = 'bold red'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'bold green'
format = '[@$hostname]($style) '

[directory]
style = 'bold blue'
truncation_length = 0
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
style = 'bold yellow'
format = '[‹$branch]($style)'

[custom.git_status]
description = 'One Git status dot, colored by the highest-priority change'
when = 'git rev-parse --git-dir >/dev/null 2>&1'
shell = ['sh']
format = '$output '
# The command emits only fixed ANSI colors and symbols, never filenames.
unsafe_no_escape = true
# Skip submodule worktree scans on every prompt; changed commits still show.
# Enter a submodule to see its own modified and untracked files.
command = '''
git status --porcelain=v1 --untracked-files=normal --ignore-submodules=dirty 2>/dev/null | awk '
{
  status = substr($0, 1, 2)
  if (status ~ /^(DD|AU|UD|UA|DU|AA|UU)$/) conflict = 1
  else if (status == "??") untracked = 1
  else {
    if (status ~ /D/) deleted = 1
    if (substr(status, 2, 1) ~ /[AMTC]/) modified = 1
    if (status ~ /R/) renamed = 1
    if (substr(status, 1, 1) ~ /[AMTC]/) staged = 1
  }
}
END {
  color = conflict ? 35 : deleted ? 31 : modified ? 33 : renamed ? 36 : staged ? 32 : untracked ? 34 : 0
  if (color) printf "\033[1;%dm●\033[0m", color
  printf "\033[1;33m›\033[0m"
}'
'''

[python]
format = '[(‹$virtualenv› )](bold green)'
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = '[\$](bold)'
error_symbol = '[\$](bold)'

[status]
disabled = false
format = '[$status ↵](bold red)'
