"$schema" = 'https://starship.rs/config-schema.json'

# Bira's two-line layout, with only the modules we actually display.
add_newline = false
format = '╭─$username$hostname$directory$git_branch${env_var.DOTFILES_GIT_STATUS}$python$line_break╰─$character'
right_format = '$status'

[username]
show_always = true
style_user = 'bold green'
style_root = 'bold red'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'bold green'
format = '[@$hostname]($style) '

[directory]
style = 'bold blue'
truncation_length = 0
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
style = 'bold yellow'
format = '[‹$branch›]($style) '

[env_var.DOTFILES_GIT_STATUS]
description = 'One Git status dot, colored by the highest-priority change'
# Zsh refreshes this fixed ANSI dot asynchronously. No command runs in Starship.
format = '$env_value'

[python]
format = '[(‹$virtualenv› )](bold green)'
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = '[\$](bold)'
error_symbol = '[\$](bold)'

[status]
disabled = false
format = '[$status ↵](bold red)'
